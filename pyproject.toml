[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "examiner-recon"
version = "1.0.0"
description = "Authorized reconnaissance and information-gathering CLI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "rich>=13.0",
  "requests>=2.31",
  "dnspython>=2.4",
  "python-whois>=0.8",
]

[project.scripts]
examiner = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "modules*", "utils*"]
